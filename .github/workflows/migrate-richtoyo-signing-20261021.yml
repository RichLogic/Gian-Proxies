name: One-time encrypted RichToyo catalog migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-richtoyo-catalog-20261021
  cancel-in-progress: false

jobs:
  encrypt:
    if: github.repository == 'RichLogic/Gian-Proxies' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'RichLogic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: catalog-production
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned encryption library before injecting secrets
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyNaCl==1.5.0 cffi==1.17.1 pycparser==2.22
      - name: Encrypt only for the approved target environment
        env:
          GIAN_CATALOG_SIGNING_KEY_PEM: ${{ secrets.GIAN_CATALOG_SIGNING_KEY_PEM }}
          TARGET_REPOSITORY: RichToyo/Gian-Proxies
          TARGET_ENVIRONMENT: catalog-production
          TARGET_PUBLIC_KEY: 'U+x11i2I8ga3t0SSnU3jms43QCDwGG95+x4WmP2f/xc='
          TARGET_KEY_ID: '3380204578043523366'
        shell: bash
        run: |
          set +x
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          from nacl.public import PublicKey, SealedBox
          names = ["GIAN_CATALOG_SIGNING_KEY_PEM"]
          values = {name: os.environ[name] for name in names}
          if any(not value for value in values.values()):
              raise RuntimeError('An expected source secret is missing')
          result = subprocess.run(['openssl', 'pkey', '-pubout', '-outform', 'DER'],
                                  input=values[names[0]].encode(), capture_output=True)
          expected = '302a300506032b65700321008721796e6bdf8798804745396bd2181cd999f261d077f09a6fdaa180091344df'
          if result.returncode != 0 or result.stdout.hex() != expected:
              raise RuntimeError('Catalog signing identity does not match the existing pin')
          public_key = base64.b64decode(os.environ['TARGET_PUBLIC_KEY'], validate=True)
          if len(public_key) != 32:
              raise RuntimeError('Invalid target encryption public key')
          box = SealedBox(PublicKey(public_key))
          sealed = {name: base64.b64encode(box.encrypt(value.encode())).decode() for name, value in values.items()}
          payload = {'schema': 1, 'target_repository': os.environ['TARGET_REPOSITORY'],
                     'environment': os.environ['TARGET_ENVIRONMENT'], 'key_id': os.environ['TARGET_KEY_ID'],
                     'public_key_sha256': hashlib.sha256(public_key).hexdigest(), 'encrypted_secrets': sealed}
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'richtoyo-encrypted-migration'
          directory.mkdir(mode=0o700, exist_ok=True)
          output = directory / 'encrypted-secrets.json'
          with output.open('x') as file:
              json.dump(payload, file)
          output.chmod(0o600)
          print('Encrypted the approved secret set for the approved target environment.')
          PY
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: richtoyo-catalog-sealed-20261021
          path: ${{ runner.temp }}/richtoyo-encrypted-migration/encrypted-secrets.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
